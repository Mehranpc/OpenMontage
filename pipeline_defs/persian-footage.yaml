name: persian-footage
version: "1.0"
description: >
  Persian (Farsi) video production over real stock footage. Reads a source (an
  article, a topic, or a supplied script), writes a Persian script, sources
  VIDEO-ONLY footage from Pexels and Pixabay, and composes a typographically
  correct RTL result with Estedad, selective typographic moments over a gradient
  scrim, a sidecar SRT built from narration word timings, and an animated brand
  watermark. Renders vertical 1080x1920 by default and landscape 1920x1080 for
  long-form YouTube.

  The on-screen text model is SELECTIVE, not a caption track: 7-9 designed
  moments in a 60-second video, each ONE grammatical Persian phrase with one
  emphasised span (an ordered segments list whose order is the reading order,
  top to bottom), with enforced empty frame between them, at most 55% text
  coverage, and the first moment on screen within 0.6s of the start. Moments
  anchor to the narration's own word timings — a timing set rescaled from
  another narration is refused, not repaired. A moment may BUILD: later segments
  join the phrase while earlier ones dim, so two facts that belong to one
  thought accumulate instead of replacing each other. The narration carries the
  sentences; accessibility is served by the sidecar SRT. There is no on-screen
  transcript, no karaoke, and no separate opening hook layer — the first moment,
  declared as a hook, is the opening, because feeds autoplay muted.

  Two things this pipeline treats as non-negotiable, because default Persian
  output fails at both: readability (correct ZWNJ, RTL, Persian digits, and line
  breaks that never strand a proclitic or enclitic) and beauty (a considered
  motion grammar rather than CSS defaults).
category: hybrid
stability: beta
default_checkpoint_policy: guided

# The pipeline reads a source document or topic, not a reference video. Style
# comes from this pipeline's own art direction, so there is nothing for a
# reference-video analysis to inform.
reference_input:
  supported: false

orchestration:
  mode: executive-producer
  skill: pipelines/persian-footage/executive-producer
  # Stock footage and local transcription cost nothing. The budget is nonzero only
  # to leave room for an optional paid TTS if the user chooses one.
  budget_default_usd: 0.50
  max_revisions_per_stage: 3
  max_send_backs: 2
  max_wall_time_minutes: 45

extensions:
  custom_scripts: true
  custom_playbooks: true
  custom_skills: true
  # This pipeline ships the tools it needs. New capabilities go through
  # skills/meta/capability-extension.md rather than being added per project.
  custom_tools: false

required_skills:
  - pipelines/persian-footage/executive-producer
  - pipelines/persian-footage/idea-director
  - pipelines/persian-footage/script-director
  - pipelines/persian-footage/scene-director
  - pipelines/persian-footage/asset-director
  - pipelines/persian-footage/edit-director
  - pipelines/persian-footage/compose-director
  - pipelines/persian-footage/final-candidate-protocol
  - meta/reviewer
  - meta/checkpoint-protocol

compatible_playbooks:
  # The Persian composition carries its own art direction in
  # remotion-composer/src/persian/tokens.ts — type scale set for Estedad's
  # metrics, gradient scrim, palette. A stock playbook would fight it: every
  # shipped playbook specifies a Latin font stack and a type scale tuned for it.
  custom_allowed: true

production_modes:
  - name: narrated
    description: >
      The user supplies (or records) Persian narration audio. Word-level timings
      are transcribed from that audio, become a sidecar SRT beside the MP4, and
      ANCHOR the moments: each moment names its words and its timing is re-derived
      from them, so a set of timings authored against another narration is
      refused by the compose gate rather than shipped drifting. Music is REQUIRED
      in this mode — a narrated deliverable with silence under the voice's pauses
      is an unfinished edit, and pixabay_music needs no key. A deliberate silence
      must be recorded as omitMusicReason.
    required_tools:
      - direct_clip_search
      - persian_compose
      - pixabay_music
    optional_tools:
      - mlx_whisper_transcriber
      - transcriber
      - audio_mixer
    agent_skills:
      - speech-to-text

  - name: silent
    description: >
      No narration and no sidecar SRT. Moment timings come from the beat
      structure, and music carries the pace. Chosen when the user wants a video
      without recording, or before narration exists. Carries far less text than
      narrated mode, since the moments are the only text a viewer ever gets.
    required_tools:
      - direct_clip_search
      - persian_compose
    optional_tools:
      - pixabay_music
      - audio_mixer

stages:
  - name: idea
    skill: pipelines/persian-footage/idea-director
    produces:
      - brief
    tools_available:
      - web_search
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - production_mode is chosen and recorded (narrated or silent) — NOT inferred later
      - format is chosen and recorded (vertical or landscape)
      - Target duration is concrete, in seconds
      - The one idea the video delivers is a single Persian sentence
      - Beat count matches the duration math (roughly one beat per 4-6 seconds)
      - "Footage feasibility is assessed per beat: can Pexels/Pixabay plausibly answer it with VIDEO"
      - "visual_subject names the concrete thing the footage is OF — a camera can point at it. Not the abstraction; 'coffee', never 'metabolism'."
      - "The source yielded specific figures and named terms the edit stage can set in type. A source read without collecting them yields a video with nothing specific to show."
      - Typographic-beat count is declared and is at most 2
    success_criteria:
      - Schema-valid brief artifact
      - metadata.production_mode is "narrated" or "silent"
      - metadata.format is "vertical" or "landscape"
      - metadata.target_duration_seconds present
      - metadata.visual_subject present and concrete
      - metadata.typographic_beat_budget present and <= 2

  - name: script
    skill: pipelines/persian-footage/script-director
    required_artifacts_in:
      - brief
    produces:
      - script
    tools_available:
      - web_search
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - "Persian orthography: ZWNJ present in every compound («می‌کند», not «میکند» or «می کند»)"
      - "Normalization: Farsi yeh (U+06CC) and keheh (U+06A9) only — no Arabic yeh/kaf"
      - Every sentence is speakable aloud in one breath
      - "Speech budget: total visible characters fit the duration at 14-16 chars/second of natural Persian delivery"
      - "At least three precise figures or named terms exist for the edit stage to set in type. «۲۲۶۴ نفر» gives a figure moment its hero; «حدود دو هزار نفر» gives it nothing."
      - Any acronym or technical term the script uses is explained in the same breath, since a term moment without a gloss is refused
      - No sentence relies on a footage shot that was judged infeasible at idea stage
      - "In narrated mode: the script is presented to the user as narration text and the stage STOPS for their audio"
    success_criteria:
      - Schema-valid script artifact
      - Persian text-quality gate passes (lib.persian_text audit reports no violations)
      - "In narrated mode: the narration text has been handed to the user"

  - name: scene_plan
    skill: pipelines/persian-footage/scene-director
    required_artifacts_in:
      - brief
      - script
    produces:
      - scene_plan
    tools_available: []
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Every footage visual event has 2 ENGLISH search queries (Pexels/Pixabay do not index Persian); semantic beats may contain multiple visual_events
      - Queries name concrete visual nouns, not the abstract idea they represent
      - "SUBJECT ANCHOR QUOTA: the first footage visual event, the last footage visual event, and at least 40% of footage visual events show the brief's visual_subject literally, each marked shows_subject: true. Legacy one-shot-per-beat plans are treated as one implicit event per beat."
      - "Beats about something else use CO-PRESENCE, not substitution: 'coffee cup beside blood sugar monitor', never 'glucose meter check'. Both things in one frame carries the beat AND keeps the subject on screen."
      - "No query uses stock-medical vocabulary the script does not name: doctor examining patient, blood test vials, DNA strand, laboratory researchers, test tubes, scientist microscope, hospital, medical chart, stethoscope, pills, capsules, measuring waist, measuring tape, weighing scale, blood pressure cuff, syringe, nurse, clinic. When the script genuinely names one, set names_banned_term: true on that visual event and pair the term with the subject in one frame."
      - Every footage visual event declares a camera move, or "none" deliberately
      - "No two adjacent visual events share BOTH shot_scale and environment. Variety comes from how the subject is shot, not from replacing it — the old rule forbade repeating the subject, which is incompatible with the anchor quota."
      - Beats that no honest footage can serve are marked typographic, within the declared budget
      - Sum of beat durations is within 10% of the target duration
      - "RUN THE GATE, do not self-assess: lib.persian_scenes.audit_scene_plan(scene_plan, typographic_budget=N) enforces every rule above. It exists because the rewritten prose was read and a banned query still shipped — the beat felt like the exception the rule allows for."
    success_criteria:
      - Schema-valid scene_plan artifact
      - metadata.subject present, matching brief.metadata.visual_subject
      - metadata.beats[] present; every new non-typographic beat carries visual_events[] whose durations sum to the beat and whose entries carry queries[], desired_affect, camera, shows_subject, shot_scale, environment
      - "lib.persian_scenes.audit_scene_plan reports no problems, and every advisory it reports has been read and answered in the checkpoint metadata"

  - name: assets
    skill: pipelines/persian-footage/asset-director
    required_artifacts_in:
      - scene_plan
    produces:
      - asset_manifest
    required_tools:
      - direct_clip_search
    optional_tools:
      - mlx_whisper_transcriber
      - transcriber
      - pixabay_music
      - video_trimmer
    tools_available:
      - direct_clip_search
      - mlx_whisper_transcriber
      - transcriber
      - pixabay_music
      - video_trimmer
      - audio_probe
    preferred_tools:
      # Word timings on Apple Silicon are fast enough to use large-v3, which is
      # the smallest model that places Persian word boundaries reliably.
      - mlx_whisper_transcriber
    fallback_tools:
      - transcriber
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - "EVERY asset is a VIDEO. A still image in the manifest is a CRITICAL violation — this pipeline forbids photo footage outright."
      - Every clip is at least as long as the beat it fills
      - Provenance (provider, original_url, license, attribution) present on every asset
      - No clip_id fills two visual events
      - Clip orientation matches the chosen format
      - "Acquisition uses only sources [pexels, pixabay_video], clips_per_query 1, one primary query per footage visual event, and at most one retry pass with the authored alternate query. No smoke-* provider probing is allowed inside a production project."
      - "Every direct_clip_search call sets max_candidates_total, max_bytes_per_clip, and max_total_download_bytes. Quota exhaustion is a blocker; the agent may not raise a limit without explicit user approval."
      - "filters.min_width is 1080. _pick_video_rendition takes the largest rendition at or below 1920px WIDE, and for a portrait clip width is the short edge — so without a floor, vertical clips arrive at 1440x2732, tens of MB each, for a 1080-wide render."
      - "The tool's post-download ffprobe values, not provider claims, satisfy duration and orientation. A mismatch or unknown probe is deleted immediately and never enters the manifest."
      - "SUBJECT SURVIVED SELECTION: the anchor quota the scene plan declared still holds in the chosen clips. Selection is where it gets lost, because the beat whose subject clip was unusable is exactly the beat where a generic one is tempting."
      - "Every asset records a selection_reason naming what is IN FRAME. 'best match' is not a reason — the coffee run's manifest recorded twelve chosen clips and nothing about what any showed, so 'waist measurement' and 'coffee cup' looked identical at the checkpoint."
      - "In narrated mode: word-level timings exist and cover the narration duration"
    success_criteria:
      - Schema-valid asset_manifest artifact
      - Every footage visual event has exactly one video asset; assets in explicit visual-event plans carry visual_event_id
      - Zero assets with kind "image"
      - Every asset is at most 1920px on its long edge
      - Every asset carries shows_subject and a selection_reason naming what is in frame
      - First and last footage visual events' assets show the subject; at least 40% of footage visual events' assets do
      - "In narrated mode: metadata.word_timings present"

  - name: edit
    skill: pipelines/persian-footage/edit-director
    required_artifacts_in:
      - scene_plan
      - asset_manifest
    produces:
      - edit_decisions
    tools_available: []
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - "render_runtime is 'remotion' and composition_mode is 'templated' — the Persian composition IS the template"
      - "renderer_family is 'persian-footage'"
      - "Moments are SELECTIVE, not a transcript: 7-9 in a 60-second video. A moment per sentence is a caption track whatever it is called, and the reading model makes 12+ moments mathematically impossible under the coverage ceiling — the two constraints force the density together."
      - "Each moment is ONE phrase in order: segments[] carries lead/hero/tail/source with the array order being the reading order, top to bottom. «مطالعهٔ دانشگاه اولوی فنلاند روی» ABOVE «۲۲۶۴ نفر» is expressed by writing it in that order; nothing sorts by role. The unit lives inside the hero text («۲۲۶۴ نفر», not «۲۲۶۴» plus a floating «نفر»), and the phrase names what the number counts — a bare numeral is the frame the user rejected."
      - "Exactly one hero per reveal step; at most one source, always last. The hero is the accent span; the lead/tail are primary ink at a designed ratio of it, so no line of the phrase is a caption on another."
      - "A BUILD is legitimate and encouraged where two facts belong to one thought: revealAfterSeconds joins the second fact while the first dims. One moment, two reveals — not two moments, which is why the gap floor does not apply between them."
      - Moments are built through lib.persian_moments.build_moments (never hand-timed) so pacing, reading-time, and opening rules are enforced
      - "lib.persian_moments.audit_moments reports no problems. Its advisories are READ, not skipped — they carry the judgements the audit deliberately declines to enforce."
      - "Text coverage is at most 55% of the runtime. This is the single number distinguishing a typographic edit from a caption track, and it is invisible in the MP4."
      - "At least 0.9s of empty frame between consecutive moments. The gaps are the design, not a shortfall in it."
      - "The FIRST moment starts within 0.6s of the video's start. Feeds autoplay muted; an empty opening frame is a blank first impression, and the deleted hook layer was wrong for being a second text layer, not for opening with type."
      - "The FIRST moment MAY paraphrase the opening narration as a hook: anchorText still names the opening words as spoken, every hook claim is said or shown later in the video, and endSeconds extends into the head gap to cover the reading charge."
      - "The opening moment declares kind 'hook' — never inferred from shape. It matches exactly one of the two hook styles in the edit-director hook section (claim+qualifier or flat display); that section is the single source for the styles, not this checklist."
      - "A hook carries no source citation, and accentWords plus the hook kind appear on the opening moment only — either past the first moment is refused."
      - "The silhouette gate refuses rectangular hooks, so prefer claim+qualifier: the flat style currently measures outside the band and is refused at compose time."
      - "In narrated mode: every moment carries anchorText naming its words AS SPOKEN ('دانشمندهای دانشگاه اولو', not the on-screen '۲۲۶۴ نفر'), and lib.persian_sync.audit_sync reports no problems. A timing authored elsewhere and rescaled fails this gate — that exact fault shipped up to 3.4s of drift."
      - "In narrated mode: a music record is present (musicTrack with licence name, URL, download date, and contentIdRisk) or omitMusicReason is recorded. Music is required in narrated mode; Pixabay Content License permits monetized Instagram use, and third-party Content-ID risk is recorded honestly — 'low', never 'guaranteed zero'."
      - "NO retired keys: no cues[], no hookText, and no moment-level text/label/kicker/unit. persian_compose refuses all of them. The slots produced three type sizes on three different left edges with no sentence anywhere."
      - Every moment's text passes the Persian orthography gate
      - "In narrated mode: audio.wordTimings is present so persian_compose writes the sidecar SRT"
      - Watermark text is present
      - "Every typographic beat carries typography across its whole window: the plate window is derived from the type span, a beat with no type fails compose, and a beat second with no type on screen is dead screen, not coverage"
    success_criteria:
      - Schema-valid edit_decisions artifact
      - edit_decisions.persian.moments[] present and audit-clean
      - No cues key, no hookText key, and no moment-level text/label/kicker/unit key anywhere in the persian block
      - Text coverage below 55%
      - "In narrated mode: audit_sync reports no problems and every moment carries anchorText"
      - "In narrated mode: musicTrack with a complete licence record, or omitMusicReason"
      - Timeline duration within 10% of brief.metadata.target_duration_seconds

  - name: compose
    skill: pipelines/persian-footage/compose-director
    required_artifacts_in:
      - edit_decisions
      - asset_manifest
      - brief
    produces:
      - render_report
    required_tools:
      - persian_compose
    optional_tools:
      - audio_mixer
    tools_available:
      - persian_compose
      - audio_mixer
      - audio_probe
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - "render_runtime MUST remain 'remotion'. The Persian composition depends on Estedad loading through FontFace and on canvas text measurement; neither exists on the ffmpeg path. A silent swap to ffmpeg or hyperframes is a CRITICAL governance violation — raise a structured blocker instead."
      - Output dimensions match the chosen format exactly
      - "Frames are MEASURED with lib.persian_verify, not eyeballed: verify_frames for ink, per-line right-edge anchor offset, text column, zone occupancy, and contrast. Frames are sampled at each MOMENT's midpoint, not at fixed intervals — text covers at most 55% of the runtime by design, so a blindly chosen window probably contains no type. Hand-rolled brightness or contrast detectors do not work over footage; the compose-director records twelve approaches that footage or the codec defeated."
      - "Post-render luminance gate: persian_compose refuses success when any contiguous run of >= 1.0s averages below YAVG 22, and warns on runs below 30 — a legitimately dark shot measures ~28 and stays legal. Coverage by an opaque plate is not evidence the screen is alive."
      - "GAPS ARE MEASURED WITH check_gap_is_empty, NOT verify_frames. A gap has no scrim by design, so ink_mask reads the footage — 31-99% 'ink' — and the moment instrument reported a confident scrim failure on a correctly empty frame. check_gap_is_empty uses accent colour separation, which needs nothing behind it. Sample the middle of EVERY gap, including the head and the tail."
      - "State the remaining pixel limit honestly: every moment now paints an accent hero, so check_gap_is_empty detects an overrun of any kind into a gap — statement gaps included. Intra-word glyph order is the one thing still not verified in pixels. Record it in verification_notes."
      - "THE ANCHOR CHECK IS THE IMPORTANT ONE: every line of every moment shares one right edge, and a line short of it means a flex row centred instead of anchoring. Centred text is still inside the width budget and still inside the zone, so a width-only check passes it. Offsets are reported PER LINE — a block maximum is satisfied by one correct line beside several that drifted."
      - "Undershoot and overshoot at the anchor are different quantities: ANCHOR_TOLERANCE_PX (32) is the glyph's right side bearing, INK_OVERSHOOT_PX (8) is renderer antialiasing plus H.264 ringing. Three of thirteen real moments overshoot by 1.4-4.4px; a ±1px overshoot rule failed all three correct frames."
      - "anchor_report over every measured line catches systematic drift that per-frame pass/fail cannot: a uniform 20px offset passes every frame and is wrong everywhere."
      - "Segment order is confirmed with check_moment_arrangement (roles=[...]) on EVERY moment, not one of them — each carries a different phrase and one sample certifies only what it saw. The check verifies the accent hero sits below the segments authored before it and above those authored after; a stack that sorted by role fails it without any expected image. Intra-word glyph order is deliberately NOT verified in pixels — ink-profile correlation beat its mirror by 0.86 in a clean rendering and by only 0.05-0.07 on the H.264 output, and a reading-order check that certifies the fault it exists to catch is worse than none."
      - "The silhouette gate refuses a flat hook at compose time: a flat opening that reached compose unflagged is an edit-stage miss, not a shippable frame."
      - "Every plateau-scoped measurement takes stackHeightPx from the props moment (attached by _maybe_attach_stack_heights) — the scrim plateau is the measurement band, the zone envelope is not a substitute."
      - "Vertical rhythm is measured with measure_stack_rhythm on moments with three or more bands: the visible gap between blocks must sit at the designed stack gap, not at line-box height. The shipped render carried 133px of half-leading masquerading as a 26px gap — the «فاصله مسخره» complaint — and the gap tokens were correct the whole time."
      - "The watermark is located with find_watermark against a no-watermark reference render, and its expected position comes from WATERMARK_TOP_FRACTION rather than a literal — the resting position differs per format."
      - "Music ducking is measured from the decoded audio, not inferred from the presence of a stream. The duck follows the NARRATION, so sample a speaking window against a silent one — a moment's timing says nothing about either."
      - "In narrated mode: the sidecar SRT exists beside the MP4, and its readability advisories are reported rather than suppressed. An over-speed subtitle is a property of how fast the narrator spoke; the honest remedy is a shorter script, not a blocked delivery."
      - Attribution for every clip is recorded in the render report
      - Output duration matches the planned duration within 1 second
    success_criteria:
      - Schema-valid render_report artifact
      - Output file exists and passes ffprobe validation
      - "Initial candidate: delivery_status is final_candidate, human_visual_approval is false, persian_text_verified is false, outputs[0].sha256 matches the MP4 bytes, and compose is awaiting_human"
      - "Only explicit approval of that exact path and sha256 completes compose with human_approved true; metadata.approval_record identifies the user response, delivery_status is approved, and the two verification booleans may become true"
      - "render_report.verification_notes carries measured numbers rather than adjectives: anchor offsets, contrast range, line counts, watermark rows — and names what was NOT verified (intra-word glyph order)"
      - render_report.moment_count and render_report.text_coverage are recorded
      - "In narrated mode: render_report.subtitle_path points at an existing SRT"
      - render_report.attributions[] covers every clip used
      - "Post-render luminance gate holds: no contiguous run of >= 1.0s averages below YAVG 22; runs below 30 are warnings, not failures"
