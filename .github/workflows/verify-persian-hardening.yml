name: Harden and verify Persian final candidate

on:
  push:
    branches:
      - feat/persian-final-candidate-review
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: verify-persian-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harden-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/persian-final-candidate-review
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion-composer/package-lock.json

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          make install-dev
          cd remotion-composer
          npm ci

      - name: Apply hardening and run independent gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 harden_persian_final_candidate.py > /tmp/migration.log 2>&1
          migration_rc=$?

          if [ "$migration_rc" -eq 0 ]; then
            python3 -m py_compile \
              lib/checkpoint.py \
              lib/persian_preflight.py \
              tests/lib/test_persian_final_candidate_protocol.py \
              > /tmp/syntax.log 2>&1
            syntax_rc=$?
            git diff --check > /tmp/diff.log 2>&1
            diff_rc=$?
            make lint > /tmp/lint.log 2>&1
            lint_rc=$?
            .venv/bin/python -m pytest tests/lib/ -q > /tmp/python.log 2>&1
            python_rc=$?
            (cd remotion-composer && ./node_modules/.bin/tsc --noEmit) \
              > /tmp/typescript.log 2>&1
            typescript_rc=$?
            OPENMONTAGE_BROWSER_TESTS=1 \
              .venv/bin/python -m unittest tests.lib.test_persian_ranked_browser -q \
              > /tmp/browser.log 2>&1
            browser_rc=$?
          else
            syntax_rc=125
            diff_rc=125
            lint_rc=125
            python_rc=125
            typescript_rc=125
            browser_rc=125
            printf 'Skipped because migration failed.\n' > /tmp/syntax.log
            cp /tmp/syntax.log /tmp/diff.log
            cp /tmp/syntax.log /tmp/lint.log
            cp /tmp/syntax.log /tmp/python.log
            cp /tmp/syntax.log /tmp/typescript.log
            cp /tmp/syntax.log /tmp/browser.log
          fi

          overall_rc=0
          for rc in "$migration_rc" "$syntax_rc" "$diff_rc" "$lint_rc" "$python_rc" "$typescript_rc" "$browser_rc"; do
            if [ "$rc" -ne 0 ]; then overall_rc=1; fi
          done
          printf 'OVERALL_RC=%s\n' "$overall_rc" >> "$GITHUB_ENV"

          MIGRATION_RC="$migration_rc" \
          SYNTAX_RC="$syntax_rc" \
          DIFF_RC="$diff_rc" \
          LINT_RC="$lint_rc" \
          PYTHON_RC="$python_rc" \
          TYPESCRIPT_RC="$typescript_rc" \
          BROWSER_RC="$browser_rc" \
          OVERALL_RC="$overall_rc" \
          SOURCE_SHA="${{ github.sha }}" \
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          checks = [
              ("hardening migration", int(os.environ["MIGRATION_RC"]), "/tmp/migration.log"),
              ("generated Python syntax", int(os.environ["SYNTAX_RC"]), "/tmp/syntax.log"),
              ("git diff --check", int(os.environ["DIFF_RC"]), "/tmp/diff.log"),
              ("make lint", int(os.environ["LINT_RC"]), "/tmp/lint.log"),
              (".venv/bin/python -m pytest tests/lib/ -q", int(os.environ["PYTHON_RC"]), "/tmp/python.log"),
              ("tsc --noEmit", int(os.environ["TYPESCRIPT_RC"]), "/tmp/typescript.log"),
              ("real-browser Persian suite in .venv", int(os.environ["BROWSER_RC"]), "/tmp/browser.log"),
          ]
          passed = int(os.environ["OVERALL_RC"]) == 0
          body = "## Persian final-candidate hardening verification\n\n"
          body += f"Aggregate result: **{'passed' if passed else 'failed'}** on source `{os.environ['SOURCE_SHA']}`. "
          body += "The hardening recomputes SHA-256 from the actual MP4 bytes at both candidate and approval checkpoints.\n\n"
          for name, rc, _ in checks:
              body += f"- {'✅' if rc == 0 else '❌'} `{name}` (exit `{rc}`)\n"
          stat = subprocess.run(
              ["git", "diff", "--stat"], text=True, capture_output=True, check=False
          ).stdout.strip()
          if stat:
              body += f"\n### Proposed diff\n\n```text\n{stat}\n```\n"
          body += "\n<details><summary>Log tails</summary>\n\n"
          for name, _, path in checks:
              lines = Path(path).read_text(errors="replace").splitlines()[-55:]
              body += f"### {name}\n\n```text\n" + "\n".join(lines) + "\n```\n\n"
          body += "</details>"
          Path("/tmp/comment.json").write_text(json.dumps({"body": body}))
          PY
          gh api --method POST "repos/${{ github.repository }}/issues/6/comments" \
            --input /tmp/comment.json
          exit 0

      - name: Commit hardening or clean failed attempt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${OVERALL_RC:-1}" -eq 0 ]; then
            git rm harden_persian_final_candidate.py .github/workflows/verify-persian-hardening.yml
            git add \
              lib/checkpoint.py \
              lib/persian_preflight.py \
              pipeline_defs/persian-footage.yaml \
              schemas/artifacts/render_report.schema.json \
              skills/pipelines/persian-footage/final-candidate-protocol.md \
              tests/lib/test_persian_final_candidate_protocol.py
            git diff --check
            git commit -m "fix: bind Persian approval to exact render bytes"
          else
            git reset --hard HEAD
            git rm harden_persian_final_candidate.py .github/workflows/verify-persian-hardening.yml
            git commit -m "chore: remove failed Persian hardening workflow"
          fi
          git push origin HEAD:feat/persian-final-candidate-review

      - name: Fail when any gate failed
        if: always()
        run: exit "${OVERALL_RC:-1}"
