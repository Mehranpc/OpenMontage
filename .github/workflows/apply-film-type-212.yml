name: Apply Film Type 2.12 safety patch

on:
  push:
    branches:
      - fix/film-type-2.12-safety
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-film-type-212-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/film-type-2.12-safety
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: remotion-composer/package-lock.json

      - name: Apply versioned patch
        run: python tools/dev/apply_film_type_212.py

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install locked composer dependencies
        run: npm ci --prefix remotion-composer

      - name: Run Python library suite
        run: python -m pytest tests/lib/ -q

      - name: Type-check composer
        run: cd remotion-composer && ./node_modules/.bin/tsc --noEmit

      - name: Run real browser regressions
        env:
          OPENMONTAGE_BROWSER_TESTS: '1'
          REMOTION_BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: python -m unittest tests.lib.test_persian_ranked_browser -q

      - name: Commit verified implementation
        run: |
          rm -f tools/dev/apply_film_type_212.py .github/workflows/apply-film-type-212.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: enforce Film Type subject and brand separation'
          git push origin HEAD:fix/film-type-2.12-safety
