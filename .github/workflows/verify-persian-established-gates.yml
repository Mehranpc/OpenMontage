name: Verify established Persian release gates

on:
  push:
    branches:
      - feat/persian-final-candidate-review
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: verify-persian-established-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/persian-final-candidate-review
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion-composer/package-lock.json

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          make install-dev
          cd remotion-composer
          npm ci

      - name: Run gates with independent status tracking
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          make lint > /tmp/lint.log 2>&1
          lint_rc=$?
          python -m pytest tests/lib/ -q > /tmp/python.log 2>&1
          python_rc=$?
          (cd remotion-composer && ./node_modules/.bin/tsc --noEmit) > /tmp/typescript.log 2>&1
          typescript_rc=$?
          OPENMONTAGE_BROWSER_TESTS=1 python -m unittest tests.lib.test_persian_ranked_browser -q > /tmp/browser.log 2>&1
          browser_rc=$?
          set -e

          printf '\n=== lint ===\n'
          tail -n 40 /tmp/lint.log
          printf '\n=== tests/lib ===\n'
          tail -n 60 /tmp/python.log
          printf '\n=== TypeScript ===\n'
          tail -n 40 /tmp/typescript.log
          printf '\n=== browser ===\n'
          tail -n 60 /tmp/browser.log

          overall_rc=0
          for rc in "$lint_rc" "$python_rc" "$typescript_rc" "$browser_rc"; do
            if [ "$rc" -ne 0 ]; then overall_rc=1; fi
          done

          LINT_RC="$lint_rc" PYTHON_RC="$python_rc" TYPESCRIPT_RC="$typescript_rc" BROWSER_RC="$browser_rc" OVERALL_RC="$overall_rc" python - <<'PY'
          import json, os
          from pathlib import Path
          checks = [
              ("make lint", int(os.environ["LINT_RC"]), "/tmp/lint.log"),
              ("python -m pytest tests/lib/ -q", int(os.environ["PYTHON_RC"]), "/tmp/python.log"),
              ("tsc --noEmit", int(os.environ["TYPESCRIPT_RC"]), "/tmp/typescript.log"),
              ("real-browser Persian suite", int(os.environ["BROWSER_RC"]), "/tmp/browser.log"),
          ]
          passed = int(os.environ["OVERALL_RC"]) == 0
          body = "## Established Persian release gates\n\n"
          body += f"Aggregate result: **{'passed' if passed else 'failed'}**.\n\n"
          for name, rc, _ in checks:
              body += f"- {'✅' if rc == 0 else '❌'} `{name}` (exit `{rc}`)\n"
          body += "\n<details><summary>Log tails</summary>\n\n"
          for name, _, path in checks:
              lines = Path(path).read_text(errors="replace").splitlines()[-45:]
              body += f"### {name}\n\n```text\n" + "\n".join(lines) + "\n```\n\n"
          body += "</details>"
          Path("/tmp/comment.json").write_text(json.dumps({"body": body}))
          PY
          gh api --method POST "repos/${{ github.repository }}/issues/6/comments" --input /tmp/comment.json
          exit "$overall_rc"

      - name: Remove temporary gate workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-persian-established-gates.yml
          git commit -m "chore: remove established-gates workflow"
          git push origin HEAD:feat/persian-final-candidate-review
