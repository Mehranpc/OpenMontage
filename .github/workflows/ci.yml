name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Film Type 2.12
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/film-type-2.12-safety
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion-composer/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Apply versioned patch
        run: python tools/dev/apply_film_type_212.py

      - name: Install Python dependencies
        run: make install-dev

      - name: Install composer dependencies
        run: npm ci --prefix remotion-composer

      - name: Run lint smoke checks
        run: make lint

      - name: Run Python library suite
        run: python -m pytest tests/lib/ -q

      - name: Type-check composer
        run: cd remotion-composer && ./node_modules/.bin/tsc --noEmit

      - name: Run real browser regressions
        env:
          OPENMONTAGE_BROWSER_TESTS: "1"
          REMOTION_BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: python -m unittest tests.lib.test_persian_ranked_browser -q

      - name: Commit verified implementation
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f tools/dev/apply_film_type_212.py .github/workflows/apply-film-type-212.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: enforce Film Type subject and brand separation'
          git push origin HEAD:fix/film-type-2.12-safety
