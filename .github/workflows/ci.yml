name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: OpenMontage CI (Mac)
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - openmontage
    timeout-minutes: 60
    env:
      PYTHON_VERSION: "3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Add Homebrew to PATH
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Verify Mac toolchain
        run: |
          python3 --version
          python3 -c 'import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 11) else 1)'
          node --version
          node -e 'process.exit(Number(process.versions.node.split(".")[0]) === 22 ? 0 : 1)'
          command -v ffmpeg
          ffmpeg -version | head -n 1

      - name: Install Python dependencies
        run: make install-dev

      - name: Install Remotion dependencies
        working-directory: remotion-composer
        run: npm ci

      - name: Run lint smoke checks
        run: make lint

      - name: Run test suite
        run: make test
