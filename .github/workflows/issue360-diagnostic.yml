name: Issue360 focused evidence diagnostic
on:
  push:
    branches: ["hoplite/praisos-da6a1c8a--360-reconcile-evidence"]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make install-dev
      - run: .venv/bin/python -m pytest tests/lib/test_issue360_reconcile_evidence.py tests/lib/test_issue360_preparation_and_stop.py -q
