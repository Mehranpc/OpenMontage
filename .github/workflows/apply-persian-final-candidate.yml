name: Apply Persian final-candidate protocol

on:
  push:
    branches:
      - feat/persian-final-candidate-review
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-persian-final-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/persian-final-candidate-review
          fetch-depth: 0

      - name: Apply protocol patch or persist diagnostics
        run: |
          set +e
          python tools/dev/apply_persian_final_candidate.py > /tmp/apply.log 2>&1
          rc=$?
          set -e
          cat /tmp/apply.log
          if [ "$rc" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            cp /tmp/apply.log migration-failure.log
            git add migration-failure.log
            git commit -m "chore: record Persian protocol migration failure"
            git push origin HEAD:feat/persian-final-candidate-review
            exit "$rc"
          fi

      - name: Validate generated syntax and diff
        run: |
          python -m py_compile lib/persian_preflight.py lib/checkpoint.py
          python -m json.tool schemas/artifacts/render_report.schema.json >/dev/null
          git diff --check

      - name: Commit permanent change and remove migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-persian-final-candidate.yml
          git rm tools/dev/apply_persian_final_candidate.py
          git add -A
          git commit -m "feat: move Persian approval to final candidate"
          git push origin HEAD:feat/persian-final-candidate-review
