name: Issue 360 readiness diagnostic
on:
  pull_request:
    branches: ["**"]
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make install-dev
      - run: .venv/bin/python -m pytest tests/lib/test_issue360_truthful_readiness.py -q
