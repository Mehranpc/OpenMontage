name: Issue 373 regression
on:
  push:
    branches: [codex/373-browser-music-admission]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make install-dev
      - run: .venv/bin/python -m pytest tests/lib/test_initial_music_scoped_recovery.py tests/lib/test_persian_music_commands.py tests/tools/test_pixabay_music.py -q
