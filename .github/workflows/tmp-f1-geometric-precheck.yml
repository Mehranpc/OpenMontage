name: Temporary F1 geometric precheck integration

on:
  push:
    branches:
      - fix/p4-geometric-hard-region-precheck

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply focused integration patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one anchor in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          geo = Path("lib/persian_geometric_precheck.py")
          text = geo.read_text(encoding="utf-8")
          old = (
              "def geometric_hard_region_precheck(\n"
              "    edit: Mapping[str, Any],\n"
              "    *,\n"
              "    film_type_profile_version: str | None,\n"
              "    repo_root: Path = REPO_ROOT,\n"
              ") -> dict[str, Any]:\n"
              "    \"\"\"Return blockers proven without browser measurement.\n\n"
              "    Missing font/profile evidence returns ``status=unknown`` and zero blockers.\n"
              "    That is deliberately not a pass: downstream Chromium remains authoritative.\n"
              "    \"\"\"\n"
              "    if film_type_profile_version != _SUPPORTED_PROFILE:\n"
              "        return {\"status\": \"unknown\", \"blockingIssues\": [], \"reason\": \"unsupported_profile\"}\n"
              "    profile = _profile(repo_root, film_type_profile_version)\n"
              "    if profile is None:\n"
              "        return {\"status\": \"unknown\", \"blockingIssues\": [], \"reason\": \"profile_unavailable\"}\n"
              "    persian = edit.get(\"persian\")\n"
              "    if not isinstance(persian, Mapping):\n"
              "        return {\"status\": \"unknown\", \"blockingIssues\": [], \"reason\": \"missing_persian\"}\n"
          )
          new = (
              "def geometric_hard_region_precheck(\n"
              "    edit: Mapping[str, Any],\n"
              "    *,\n"
              "    film_type_profile_version: str | None = None,\n"
              "    repo_root: Path = REPO_ROOT,\n"
              ") -> dict[str, Any]:\n"
              "    \"\"\"Return blockers proven without browser measurement.\n\n"
              "    Missing font/profile evidence returns ``status=unknown`` and zero blockers.\n"
              "    That is deliberately not a pass: downstream Chromium remains authoritative.\n"
              "    \"\"\"\n"
              "    persian = edit.get(\"persian\")\n"
              "    if not isinstance(persian, Mapping):\n"
              "        return {\"status\": \"unknown\", \"blockingIssues\": [], \"reason\": \"missing_persian\"}\n"
              "    if film_type_profile_version is None:\n"
              "        design = persian.get(\"design\")\n"
              "        if isinstance(design, Mapping):\n"
              "            raw_version = str(design.get(\"profileVersion\") or \"\").strip()\n"
              "            film_type_profile_version = raw_version or None\n"
              "    if film_type_profile_version != _SUPPORTED_PROFILE:\n"
              "        return {\"status\": \"unknown\", \"blockingIssues\": [], \"reason\": \"unsupported_profile\"}\n"
              "    profile = _profile(repo_root, film_type_profile_version)\n"
              "    if profile is None:\n"
              "        return {\"status\": \"unknown\", \"blockingIssues\": [], \"reason\": \"profile_unavailable\"}\n"
          )
          if text.count(old) != 1:
              raise SystemExit("geometric helper signature anchor mismatch")
          geo.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "lib/persian_preflight.py",
              "from typing import Any\n",
              "from typing import Any, Mapping\n",
          )
          replace_once(
              "lib/persian_preflight.py",
              "from lib.persian_film_type import FilmTypePreflightError\n",
              "from lib.persian_film_type import FilmTypePreflightError\nfrom lib.persian_geometric_precheck import geometric_hard_region_precheck\n",
          )
          replace_once(
              "lib/persian_preflight.py",
              'PREFLIGHT_POLICY_VERSION = "2.3"',
              'PREFLIGHT_POLICY_VERSION = "2.4"',
          )
          old = (
              '    evidence["watermarkPolicy"] = {\n'
              '        "placement": "approved-fixed-anchors",\n'
              '        "subjectGeometryAgnostic": True,\n'
              '        "collisionInputs": ["subtitle", "editorial_text"],\n'
              '    }\n\n'
              '    if blocking:\n'
          )
          new = (
              '    evidence["watermarkPolicy"] = {\n'
              '        "placement": "approved-fixed-anchors",\n'
              '        "subjectGeometryAgnostic": True,\n'
              '        "collisionInputs": ["subtitle", "editorial_text"],\n'
              '    }\n\n'
              '    if not blocking:\n'
              '        geometry = geometric_hard_region_precheck(edit, repo_root=root)\n'
              '        evidence["geometricPrecheck"] = geometry\n'
              '        geometry_blockers = geometry.get("blockingIssues")\n'
              '        if isinstance(geometry_blockers, list) and geometry_blockers:\n'
              '            layers.append("geometric_precheck")\n'
              '            blocking.extend(dict(item) for item in geometry_blockers if isinstance(item, Mapping))\n'
              '            actions.append("Repair the reviewed asset/subject geometry; do not weaken hard regions or approved copy.")\n\n'
              '    if blocking:\n'
          )
          replace_once("lib/persian_preflight.py", old, new)

          replace_once(
              "lib/persian_edit_workspace.py",
              "from lib.persian_hook_quality import HOOK_TIMING_POLICY_VERSION\n",
              "from lib.persian_hook_quality import HOOK_TIMING_POLICY_VERSION\nfrom lib.persian_geometric_precheck import geometric_hard_region_precheck\n",
          )
          replace_once(
              "lib/persian_edit_workspace.py",
              '        "lib/persian_film_type.py",\n',
              '        "lib/persian_film_type.py",\n        "lib/persian_geometric_precheck.py",\n',
          )
          old = "    diagnostic_cause = dict(issue) if issue else None\n    expected_identity = {\n"
          new = (
              '    geometry = geometric_hard_region_precheck(edit, repo_root=REPO_ROOT)\n'
              '    geometry_blockers = geometry.get("blockingIssues")\n'
              '    if isinstance(geometry_blockers, list) and geometry_blockers:\n'
              '        blocker = next((dict(item) for item in geometry_blockers if isinstance(item, Mapping)), {})\n'
              '        code = str(blocker.get("code") or "ASSET_SELECTION_HARD_REGION_COLLISION")\n'
              '        details = blocker.get("details") if isinstance(blocker.get("details"), Mapping) else {}\n'
              '        raise PersianEditWorkspaceError(\n'
              '            f"[{code}] geometric precheck refused before candidate consumption; "\n'
              '            f"details.stage={details.get(\'stage\', \'geometric_precheck\')}; "\n'
              '            f"{blocker.get(\'message\', \'provably infeasible reviewed hard-region geometry\')}"\n'
              '        )\n\n'
              '    diagnostic_cause = dict(issue) if issue else None\n'
              '    expected_identity = {\n'
          )
          replace_once("lib/persian_edit_workspace.py", old, new)
          PY
      - name: Install test dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: Run focused F1 regressions
        run: |
          python -m pytest tests/lib/test_persian_geometric_precheck.py -q
          python -m py_compile lib/persian_geometric_precheck.py lib/persian_preflight.py lib/persian_edit_workspace.py
      - name: Commit verified implementation and remove scaffold
        shell: bash
        run: |
          rm .github/workflows/tmp-f1-geometric-precheck.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reject provably impossible hard-region layouts early"
          git push origin HEAD:${GITHUB_REF_NAME}
