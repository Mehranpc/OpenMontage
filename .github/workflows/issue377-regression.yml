name: Issue 377 regression
on:
  push:
    branches: [codex/377-region-recovery]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/lib/test_issue377_region_recovery.py -q
