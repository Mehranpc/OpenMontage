name: Issue 358 diagnosis
on:
  pull_request:
    branches: [main]
concurrency:
  group: issue358-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/lib/test_issue358_frame_review_contract.py tests/lib/test_issue337_placement_space_placeholder.py tests/lib/test_issue35_asset_candidate_workspace.py tests/lib/test_persian_asset_commands.py -q
