name: Materialize verified CI baseline repair

on:
  push:
    branches:
      - fix/restore-green-ci-baseline
    paths:
      - .github/workflows/verify-ci-baseline-fix.yml

permissions:
  contents: write
  issues: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-green-ci-baseline
          fetch-depth: 0

      - name: Apply already-verified repair
        run: python3 fix_ci_baseline.py

      - name: Validate and commit permanent files
        run: |
          python3 -m py_compile \
            tests/contracts/test_persian_geometry_parity.py \
            tests/tools/test_hyperframes_compose.py \
            tests/tools/test_persian_default_film_type.py
          git diff --check
          git add \
            .github/workflows/ci.yml \
            tests/contracts/test_persian_geometry_parity.py \
            tests/tools/test_hyperframes_compose.py \
            tests/tools/test_persian_default_film_type.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: restore a green full-suite CI baseline"
          git push origin HEAD:fix/restore-green-ci-baseline

      - name: Record materialization
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 7 --repo "$GITHUB_REPOSITORY" --body "Verified repair materialized at commit $(git rev-parse HEAD). Temporary bootstrap files will now be removed from the branch."
