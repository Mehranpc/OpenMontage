name: Materialize verified CI test repairs

on:
  push:
    branches:
      - fix/restore-green-ci-baseline
    paths:
      - fix_ci_baseline.py
      - .github/workflows/verify-ci-baseline-fix.yml

permissions:
  contents: write
  issues: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-green-ci-baseline
          fetch-depth: 0

      - name: Apply verified repair
        run: python3 fix_ci_baseline.py

      - name: Validate permanent test files
        run: |
          python3 -m py_compile \
            tests/contracts/test_persian_geometry_parity.py \
            tests/tools/conftest.py \
            tests/tools/test_persian_default_film_type.py
          git diff --check

      - name: Commit non-workflow repairs
        id: materialize
        continue-on-error: true
        shell: bash
        run: |
          set +e
          git add \
            tests/contracts/test_persian_geometry_parity.py \
            tests/tools/conftest.py \
            tests/tools/test_persian_default_film_type.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: make CI baseline fixtures hermetic" > /tmp/materialize.log 2>&1
          commit_status=$?
          push_status=99
          if [ "$commit_status" -eq 0 ]; then
            git push origin HEAD:fix/restore-green-ci-baseline >> /tmp/materialize.log 2>&1
            push_status=$?
          fi
          {
            echo "commit_status=$commit_status"
            echo "push_status=$push_status"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record materialization result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_STATUS: ${{ steps.materialize.outputs.commit_status }}
          PUSH_STATUS: ${{ steps.materialize.outputs.push_status }}
        run: |
          {
            echo "## Non-workflow baseline repair materialization"
            echo
            echo "- commit exit: \`$COMMIT_STATUS\`"
            echo "- push exit: \`$PUSH_STATUS\`"
            echo
            echo '```text'
            tail -c 6000 /tmp/materialize.log
            echo
            echo '```'
          } > /tmp/materialize-comment.md
          gh issue comment 7 --repo "$GITHUB_REPOSITORY" --body-file /tmp/materialize-comment.md

      - name: Fail if materialization failed
        if: steps.materialize.outputs.commit_status != '0' || steps.materialize.outputs.push_status != '0'
        run: exit 1
