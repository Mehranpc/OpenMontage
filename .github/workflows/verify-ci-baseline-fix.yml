name: Verify scoped CI baseline repair

on:
  push:
    branches:
      - fix/restore-green-ci-baseline
    paths:
      - fix_ci_baseline.py
      - .github/workflows/verify-ci-baseline-fix.yml

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-green-ci-baseline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion-composer/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: make install-dev

      - name: Install Remotion dependencies
        working-directory: remotion-composer
        run: npm ci

      - name: Apply scoped repair
        run: python3 fix_ci_baseline.py

      - name: Validate generated sources
        run: |
          .venv/bin/python -m py_compile \
            tests/contracts/test_persian_geometry_parity.py \
            tests/tools/conftest.py \
            tests/tools/test_persian_default_film_type.py
          git diff --check

      - name: Run verification matrix
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          make lint > /tmp/lint.log 2>&1
          lint_status=$?

          .venv/bin/python -m pytest \
            tests/contracts/test_persian_geometry_parity.py \
            tests/tools/test_hyperframes_compose.py \
            tests/tools/test_persian_default_film_type.py \
            -q > /tmp/targeted.log 2>&1
          targeted_status=$?

          make test > /tmp/full.log 2>&1
          full_status=$?

          (cd remotion-composer && ./node_modules/.bin/tsc --noEmit) > /tmp/tsc.log 2>&1
          tsc_status=$?

          if [ "$lint_status" -eq 0 ] && [ "$targeted_status" -eq 0 ] && [ "$full_status" -eq 0 ] && [ "$tsc_status" -eq 0 ]; then
            aggregate=passed
          else
            aggregate=failed
          fi

          {
            echo "aggregate=$aggregate"
            echo "lint_status=$lint_status"
            echo "targeted_status=$targeted_status"
            echo "full_status=$full_status"
            echo "tsc_status=$tsc_status"
          } >> "$GITHUB_OUTPUT"

      - name: Comment verification result
        if: always() && steps.verify.outputs.aggregate != ''
        env:
          GH_TOKEN: ${{ github.token }}
          AGGREGATE: ${{ steps.verify.outputs.aggregate }}
          LINT_STATUS: ${{ steps.verify.outputs.lint_status }}
          TARGETED_STATUS: ${{ steps.verify.outputs.targeted_status }}
          FULL_STATUS: ${{ steps.verify.outputs.full_status }}
          TSC_STATUS: ${{ steps.verify.outputs.tsc_status }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          def tail(path: str, limit: int = 6000) -> str:
              text = Path(path).read_text(encoding="utf-8", errors="replace")
              return text[-limit:]

          body = f"""## CI baseline repair verification — scoped fixture

          Aggregate result: **{os.environ['AGGREGATE']}**.

          - `make lint`: exit `{os.environ['LINT_STATUS']}`
          - focused baseline regressions: exit `{os.environ['TARGETED_STATUS']}`
          - full `make test`: exit `{os.environ['FULL_STATUS']}`
          - `tsc --noEmit`: exit `{os.environ['TSC_STATUS']}`

          <details><summary>Focused test tail</summary>

          ```text
          {tail('/tmp/targeted.log')}
          ```
          </details>

          <details><summary>Full-suite tail</summary>

          ```text
          {tail('/tmp/full.log')}
          ```
          </details>
          """
          Path("/tmp/comment.md").write_text(body, encoding="utf-8")
          PY
          gh issue comment 7 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Fail when a gate failed
        if: steps.verify.outputs.aggregate != 'passed'
        run: exit 1
