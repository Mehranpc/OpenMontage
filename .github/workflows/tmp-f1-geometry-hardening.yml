name: Temporary F1 geometry hardening

on:
  push:
    branches:
      - fix/p4-geometric-hard-region-precheck

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Harden malformed-input handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("lib/persian_geometric_precheck.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f"expected one anchor, found {text.count(old)}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once("import json\nimport re\n", "import json\nimport math\nimport re\n")
          replace_once(
              '''def _intersects(a: Mapping[str, float], b: Mapping[str, float]) -> bool:\n    return (\n        a["x"] < b["x"] + b["w"]\n        and a["x"] + a["w"] > b["x"]\n        and a["y"] < b["y"] + b["h"]\n        and a["y"] + a["h"] > b["y"]\n    )\n\n\n''',
              '''def _intersects(a: Mapping[str, float], b: Mapping[str, float]) -> bool:\n    return (\n        a["x"] < b["x"] + b["w"]\n        and a["x"] + a["w"] > b["x"]\n        and a["y"] < b["y"] + b["h"]\n        and a["y"] + a["h"] > b["y"]\n    )\n\n\ndef _normalized_rect(value: Mapping[str, float]) -> bool:\n    try:\n        x, y, w, h = (float(value[key]) for key in ("x", "y", "w", "h"))\n    except (KeyError, TypeError, ValueError):\n        return False\n    return (\n        all(math.isfinite(item) for item in (x, y, w, h))\n        and x >= 0.0 and y >= 0.0 and w > 0.0 and h > 0.0\n        and x + w <= 1.0 + 1e-9 and y + h <= 1.0 + 1e-9\n    )\n\n\n''',
          )
          replace_once(
              '''def prove_mandatory_strip_infeasible(\n    *,\n    safe_area: Mapping[str, float],\n    hard_regions: Sequence[Mapping[str, float]],\n    width_fraction: float,\n    height_fraction: float,\n) -> bool:\n    """Pure reject-only rectangle proof used by the F1 fixture regression."""\n    return not _can_place_strip(\n        safe=safe_area,\n        obstacles=hard_regions,\n        width=width_fraction,\n        height=height_fraction,\n    )\n''',
              '''def prove_mandatory_strip_infeasible(\n    *,\n    safe_area: Mapping[str, float],\n    hard_regions: Sequence[Mapping[str, float]],\n    width_fraction: float,\n    height_fraction: float,\n) -> bool:\n    """Pure reject-only rectangle proof used by the F1 fixture regression."""\n    if (\n        not _normalized_rect(safe_area)\n        or not math.isfinite(width_fraction)\n        or not math.isfinite(height_fraction)\n        or width_fraction <= 0\n        or height_fraction <= 0\n    ):\n        return False\n    valid_regions = [region for region in hard_regions if _normalized_rect(region)]\n    return not _can_place_strip(\n        safe=safe_area,\n        obstacles=valid_regions,\n        width=width_fraction,\n        height=height_fraction,\n    )\n''',
          )
          replace_once(
              '''    safe = {"x": left, "y": top, "w": 1.0 - left - right, "h": 1.0 - top - bottom}\n    if safe["w"] <= 0 or safe["h"] <= 0:\n        return {"status": "unknown", "blockingIssues": [], "reason": "invalid_safe_area"}\n''',
              '''    safe = {"x": left, "y": top, "w": 1.0 - left - right, "h": 1.0 - top - bottom}\n    if not _normalized_rect(safe):\n        return {"status": "unknown", "blockingIssues": [], "reason": "invalid_safe_area"}\n''',
          )
          replace_once(
              '''        width_px, token_sha, font_sha = measurement\n        width_norm = width_px / dims[0]\n''',
              '''        width_px, token_sha, font_sha = measurement\n        if not math.isfinite(width_px) or width_px <= 0:\n            continue\n        width_norm = width_px / dims[0]\n''',
          )
          replace_once(
              '''        except (KeyError, TypeError, ValueError):\n            continue\n        obstacles: list[dict[str, float]] = []\n''',
              '''        except (KeyError, TypeError, ValueError):\n            continue\n        if not all(math.isfinite(item) for item in (moment_start, moment_end)) or moment_end <= moment_start:\n            continue\n        obstacles: list[dict[str, float]] = []\n''',
          )
          replace_once(
              '''            except (TypeError, ValueError):\n                continue\n            if shot_start >= moment_end or shot_end <= moment_start:\n                continue\n''',
              '''            except (TypeError, ValueError):\n                continue\n            if (\n                not all(math.isfinite(item) for item in (shot_start, shot_end))\n                or shot_end <= shot_start\n                or shot_start >= moment_end\n                or shot_end <= moment_start\n            ):\n                continue\n''',
          )
          replace_once(
              '''                except (KeyError, TypeError, ValueError):\n                    continue\n                if start >= moment_end or end <= moment_start:\n                    continue\n                if obstacle["w"] <= 0 or obstacle["h"] <= 0:\n                    continue\n''',
              '''                except (KeyError, TypeError, ValueError):\n                    continue\n                if (\n                    not all(math.isfinite(item) for item in (start, end))\n                    or end <= start\n                    or start < shot_start - 1e-9\n                    or end > shot_end + 1e-9\n                    or start >= moment_end\n                    or end <= moment_start\n                    or not _normalized_rect(obstacle)\n                ):\n                    continue\n''',
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: Verify focused F1 suite
        run: |
          python -m pytest tests/lib/test_persian_geometric_precheck.py -q
          python -m py_compile lib/persian_geometric_precheck.py
      - name: Commit and remove scaffold
        shell: bash
        run: |
          rm .github/workflows/tmp-f1-geometry-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep F1 geometry proof reject-only"
          git push origin HEAD:${GITHUB_REF_NAME}
