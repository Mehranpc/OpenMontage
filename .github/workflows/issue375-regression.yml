name: Issue 375 regression
on:
  push:
    branches: [codex/375-completed-phase-budget]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make install-dev
      - run: .venv/bin/python -m pytest tests/lib/test_issue375_completed_phase_budget.py tests/lib/test_issue342_parked_time_not_wall_budget.py tests/lib/test_issue350_budget_stop_revalidation.py -q
