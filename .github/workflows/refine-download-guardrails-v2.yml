          W3DDa49KDTPQhk3dLAI3WNArR7Ao7q7fvZtp9PM7rcStfwBMe4NNzgwAAA==
          B64

          status=0
          sed 's/^          //' /tmp/refine.py.gz.b64 | base64 -d | gzip -d > /tmp/refine.py 2>/tmp/decode.log || status=$?
          if [ "$status" -eq 0 ]; then
            python /tmp/refine.py > /tmp/refine.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python -m py_compile tools/video/direct_clip_search.py tests/tools/test_direct_clip_search_limits.py > /tmp/compile.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            make install-dev > /tmp/install.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            .venv/bin/python -m pytest tests/tools/test_direct_clip_search_limits.py tests/tools/test_stock_source_adapters.py -q > /tmp/tests.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            make lint > /tmp/lint.log 2>&1 || status=$?
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -eq 0 ]; then
            git add tools/video/direct_clip_search.py tests/tools/test_direct_clip_search_limits.py
            git diff --cached --check
            git commit -m "fix: distinguish validation and deadline timeouts"
          else
            git restore tools/video/direct_clip_search.py tests/tools/test_direct_clip_search_limits.py
            {
              echo "status=$status"
              for log in /tmp/decode.log /tmp/refine.log /tmp/compile.log /tmp/install.log /tmp/tests.log /tmp/lint.log; do
                if [ -f "$log" ]; then
                  echo "--- $log"
                  tail -n 80 "$log"
                fi
              done
            } > .refine-download-guardrails-diagnostic.txt
            git add .refine-download-guardrails-diagnostic.txt
            git commit -m "test: record guardrail refinement failure"
          fi
          git push origin HEAD:fix/bound-stock-footage-acquisition
