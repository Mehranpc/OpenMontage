name: Stale selection status diagnostic
on:
  push:
    branches: [codex/360-stale-selection-status]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make install-dev
      - run: .venv/bin/python -m pytest tests/lib/test_stale_selection_status.py tests/lib/test_issue360_truthful_readiness.py tests/lib/test_issue360_preparation_and_stop.py tests/lib/test_issue360_shared_admission.py tests/lib/test_issue35_asset_candidate_workspace.py tests/lib/test_issue331_acquisition_next_step.py -q
