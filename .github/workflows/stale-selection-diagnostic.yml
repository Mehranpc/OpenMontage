name: Stale selection status diagnostic
on:
  push:
    branches: [codex/360-stale-selection-status]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make install-dev
      - run: .venv/bin/python -m pytest tests/lib/test_stale_selection_status.py -q
