name: Verify Issue 12

on:
  pull_request:
    branches:
      - fix/script-aligned-persian-srt
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'verify/issue-12-ci'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remotion-composer/package-lock.json
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run and record verification
        shell: bash
        run: |
          set +e
          : > "$RUNNER_TEMP/statuses"
          run_check() {
            key="$1"
            shift
            "$@" > "$RUNNER_TEMP/$key.log" 2>&1
            status=$?
            printf '%s=%s\n' "$key" "$status" >> "$RUNNER_TEMP/statuses"
          }

          verified_sha="$(git rev-parse HEAD)"
          run_check install_python make install-dev
          run_check install_remotion bash -lc 'cd remotion-composer && npm ci'
          run_check lint make lint
          run_check focused .venv/bin/python -m pytest \
            tests/lib/test_persian_srt_alignment.py \
            tests/lib/test_persian_srt_alignment_policy.py -v
          run_check persian_regressions .venv/bin/python -m pytest \
            tests/lib/test_persian_gates.py \
            tests/lib/test_persian_final_candidate_protocol.py -v
          run_check full_suite make test
          run_check diff_check git diff --check

          overall=pass
          while IFS='=' read -r key status; do
            if [ "$status" != "0" ]; then overall=fail; fi
          done < "$RUNNER_TEMP/statuses"

          {
            echo '# Issue 12 verification'
            echo
            echo "- verified head: $verified_sha"
            echo "- overall: $overall"
            echo
            echo '## Statuses'
            while IFS='=' read -r key status; do
              echo "- $key: $status"
            done < "$RUNNER_TEMP/statuses"
            for key in install_python install_remotion lint focused persian_regressions full_suite diff_check; do
              echo
              echo "## $key (tail)"
              echo '```text'
              tail -n 160 "$RUNNER_TEMP/$key.log"
              echo '```'
            done
          } > .issue-12-verification-result.md
          rm -f .issue-12-verification-request
      - name: Commit verification result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .issue-12-verification-request .issue-12-verification-result.md
          git commit -m 'test: record issue 12 verification'
          git push origin HEAD:${{ github.head_ref }}
