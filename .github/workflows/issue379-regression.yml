name: Issue 379 regression
on:
  push:
    branches: [codex/379-scoped-attempt-budget]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest pytest-subtests
      - run: python -m pytest tests/lib/test_issue379_scoped_attempt_budget.py -q
