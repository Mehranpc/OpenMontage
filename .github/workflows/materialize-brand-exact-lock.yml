name: Materialize Persian brand and exact text lock

on:
  push:
    branches:
      - fix/lock-persian-brand-exact-text

permissions:
  contents: write

jobs:
  materialize-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Materialize or record failure
        shell: bash
        run: |
          set +e
          python .brand-lock-materialize.py > /tmp/materialize.log 2>&1
          status=$?
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$status" -eq 0 ]; then
            git add -A
            git diff --cached --check
            git commit -m "fix: lock Persian brand and exact display text"
          else
            git reset --hard HEAD
            {
              echo "result=failure"
              echo "input_head=$(git rev-parse HEAD)"
              echo "materialize_status=$status"
              echo "===== /tmp/materialize.log ====="
              cat /tmp/materialize.log
            } > .brand-lock-diagnostics.txt
            git add .brand-lock-diagnostics.txt
            git commit -m "chore: record Persian brand materialization failure"
          fi
          git push origin HEAD:fix/lock-persian-brand-exact-text
