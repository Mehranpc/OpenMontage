name: Decode Persian brand lock generator

on:
  push:
    branches:
      - fix/lock-persian-brand-exact-text
    paths:
      - brand-lock.b64.part-0
      - brand-lock.b64.part-1
      - brand-lock.b64.part-2
      - .github/workflows/materialize-brand-exact-lock.yml

permissions:
  contents: write

jobs:
  decode-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and validate generator
        shell: bash
        run: |
          set -euo pipefail
          cat brand-lock.b64.part-* \
            | tr -d '\n' \
            | base64 -d \
            | gzip -d \
            > .brand-lock-generator.py
          python -m py_compile .brand-lock-generator.py
          echo "3ff30db8eca9357db1149545930212b051fbce4c0d4c50e6a77004c10a349188  .brand-lock-generator.py" \
            | sha256sum --check --strict
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .brand-lock-generator.py
          git diff --cached --check
          git commit -m "chore: decode Persian brand generator for repair"
          git push origin HEAD:fix/lock-persian-brand-exact-text
