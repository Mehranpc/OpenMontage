name: Materialize Persian brand and exact text lock

on:
  push:
    branches:
      - fix/lock-persian-brand-exact-text
    paths:
      - brand-lock.b64.part-0
      - brand-lock.b64.part-1
      - brand-lock.b64.part-2
      - .github/workflows/materialize-brand-exact-lock.yml

permissions:
  contents: write

jobs:
  materialize-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion-composer/package-lock.json

      - name: Repair, materialize, verify, and record
        shell: bash
        run: |
          set +e
          input_head="$(git rev-parse HEAD)"
          expected_sha="3ff30db8eca9357db1149545930212b051fbce4c0d4c50e6a77004c10a349188"
          original_sha="$(sha256sum .brand-lock-generator.py 2>/dev/null | awk '{print $1}')"
          [ "$original_sha" = "$expected_sha" ]
          original_sha_status=$?

          python - <<'PY' > /tmp/generator-repair.log 2>&1
          from pathlib import Path

          source = Path(".brand-lock-generator.py").read_text(encoding="utf-8")
          start_marker = (
              'replace_once(\n'
              '    "remotion-composer/src/persian/types.ts",\n'
              "    '''  for (const [index, segment] of moment.segments.entries()) {\n"
          )
          end_marker = (
              '\nreplace_once(\n'
              '    "remotion-composer/src/persian/filmType/layout.ts",'
          )
          if source.count(start_marker) != 1:
              raise RuntimeError(
                  f"expected one ambiguous TypeScript patch block, got {source.count(start_marker)}"
              )
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = """replace_once(
              "remotion-composer/src/persian/types.ts",
              '''  if (sources.length === 1 && moment.segments[moment.segments.length - 1].role !== "source") {
              throw new Error(
                `${where}: a 'source' segment must be last. It is a citation appended to ` +
                  `the phrase, not a part of it, so anywhere else it interrupts the sentence.`,
              );
            }

            for (const [index, segment] of moment.segments.entries()) {
          ''',
              '''  if (sources.length === 1 && moment.segments[moment.segments.length - 1].role !== "source") {
              throw new Error(
                `${where}: a 'source' segment must be last. It is a citation appended to ` +
                  `the phrase, not a part of it, so anywhere else it interrupts the sentence.`,
              );
            }

            if (moment.exactText) {
              const displayText = moment.segments
                .filter((segment) => segment.role !== "source")
                .map((segment) => segment.text)
                .join(" ");
              if (
                moment.exactText.encoding !== "utf-8" ||
                moment.exactText.normalization !== "none" ||
                displayText !== moment.exactText.text
              ) {
                throw new Error(
                  `${where}: exactText does not equal the displayed segments byte-for-byte; ` +
                    `strict punctuation, code points, whitespace, and digits may not be normalized.`,
                );
              }
            }

            for (const [index, segment] of moment.segments.entries()) {
          ''',
          )
          """
          Path("/tmp/apply_brand_exact_lock.py").write_text(
              source[:start] + replacement + source[end:], encoding="utf-8"
          )
          print("repaired ambiguous TypeScript insertion target")
          PY
          generator_repair_status=$?
          patched_sha="$(sha256sum /tmp/apply_brand_exact_lock.py 2>/dev/null | awk '{print $1}')"
          python -m py_compile /tmp/apply_brand_exact_lock.py \
            > /tmp/generator-compile.log 2>&1
          generator_compile_status=$?

          if [ "$original_sha_status" -eq 0 ] \
            && [ "$generator_repair_status" -eq 0 ] \
            && [ "$generator_compile_status" -eq 0 ]; then
            rm -f .brand-lock-generator.py .brand-lock-diagnostics.txt
            python /tmp/apply_brand_exact_lock.py > /tmp/materialize.log 2>&1
            materialize_status=$?
          else
            materialize_status=125
            echo "Skipped because generator integrity, repair, or compile failed." \
              > /tmp/materialize.log
          fi

          if [ "$materialize_status" -eq 0 ]; then
            python - <<'PY' > /tmp/post-materialize-repair.log 2>&1
          from pathlib import Path

          path = Path("tests/lib/test_persian_brand.py")
          text = path.read_text(encoding="utf-8")
          old = '    assert "Pathway_of_Surrender" not in typescript\n'
          new = '    assert "@Pathway_of_Surrender" not in typescript\n'
          if text.count(old) != 1:
              raise RuntimeError(
                  f"expected one globally-rewritten regression assertion, got {text.count(old)}"
              )
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          print("restored legacy-handle negative regression assertion")
          PY
            post_repair_status=$?

            python -m py_compile \
              lib/persian_brand.py \
              lib/persian_moments.py \
              tools/video/persian_compose.py \
              tests/lib/test_persian_brand.py \
              tests/lib/test_persian_film_type.py \
              > /tmp/changed-python-compile.log 2>&1
            changed_python_compile_status=$?

            make install-dev > /tmp/install-dev.log 2>&1
            install_dev_status=$?
            npm ci --prefix remotion-composer > /tmp/npm-ci.log 2>&1
            npm_ci_status=$?
          else
            post_repair_status=125
            changed_python_compile_status=125
            install_dev_status=125
            npm_ci_status=125
            echo "Skipped because materialization failed." > /tmp/post-materialize-repair.log
            cp /tmp/post-materialize-repair.log /tmp/changed-python-compile.log
            cp /tmp/post-materialize-repair.log /tmp/install-dev.log
            cp /tmp/post-materialize-repair.log /tmp/npm-ci.log
          fi

          if [ "$post_repair_status" -eq 0 ] && [ "$install_dev_status" -eq 0 ]; then
            .venv/bin/python -m pytest \
              tests/lib/test_persian_brand.py \
              tests/lib/test_persian_film_type.py \
              tests/lib/test_persian_gates.py \
              tests/contracts/test_persian_text_parity.py \
              -q --tb=short > /tmp/focused-pytest.log 2>&1
            focused_pytest_status=$?

            .venv/bin/python -m pytest tests/lib/ -q --tb=short \
              > /tmp/lib-pytest.log 2>&1
            lib_pytest_status=$?

            OPENMONTAGE_BROWSER_TESTS=1 \
              .venv/bin/python -m unittest \
              tests.lib.test_persian_ranked_browser -q \
              > /tmp/browser-tests.log 2>&1
            browser_tests_status=$?

            make lint > /tmp/lint.log 2>&1
            lint_status=$?
          else
            focused_pytest_status=125
            lib_pytest_status=125
            browser_tests_status=125
            lint_status=125
            echo "Skipped because materialization repair or Python install failed." \
              > /tmp/focused-pytest.log
            cp /tmp/focused-pytest.log /tmp/lib-pytest.log
            cp /tmp/focused-pytest.log /tmp/browser-tests.log
            cp /tmp/focused-pytest.log /tmp/lint.log
          fi

          if [ "$post_repair_status" -eq 0 ] && [ "$npm_ci_status" -eq 0 ]; then
            (cd remotion-composer && ./node_modules/.bin/tsc --noEmit) \
              > /tmp/tsc.log 2>&1
            tsc_status=$?
          else
            tsc_status=125
            echo "Skipped because materialization repair or Node install failed." \
              > /tmp/tsc.log
          fi

          if [ "$post_repair_status" -eq 0 ]; then
            git add -u
            git add lib/persian_brand.py tests/lib/test_persian_brand.py
            git diff --cached --check > /tmp/diff-check.log 2>&1
            diff_check_status=$?
            git reset > /dev/null
          else
            diff_check_status=125
            echo "Skipped because materialization repair failed." > /tmp/diff-check.log
          fi

          statuses=(
            "$original_sha_status" "$generator_repair_status"
            "$generator_compile_status" "$materialize_status" "$post_repair_status"
            "$changed_python_compile_status" "$install_dev_status" "$npm_ci_status"
            "$focused_pytest_status" "$lib_pytest_status" "$browser_tests_status"
            "$tsc_status" "$lint_status" "$diff_check_status"
          )
          result=success
          for status in "${statuses[@]}"; do
            [ "$status" -eq 0 ] || result=failure
          done

          report=/tmp/brand-lock-result.txt
          {
            echo "result=$result"
            echo "input_head=$input_head"
            echo "python=$(python --version 2>&1)"
            echo "node=$(node --version 2>&1)"
            echo "generator_original_expected_sha=$expected_sha"
            echo "generator_original_actual_sha=$original_sha"
            echo "generator_patched_sha=$patched_sha"
            echo "original_sha_status=$original_sha_status"
            echo "generator_repair_status=$generator_repair_status"
            echo "generator_compile_status=$generator_compile_status"
            echo "materialize_status=$materialize_status"
            echo "post_repair_status=$post_repair_status"
            echo "changed_python_compile_status=$changed_python_compile_status"
            echo "install_dev_status=$install_dev_status"
            echo "npm_ci_status=$npm_ci_status"
            echo "focused_pytest_status=$focused_pytest_status"
            echo "lib_pytest_status=$lib_pytest_status"
            echo "browser_tests_status=$browser_tests_status"
            echo "tsc_status=$tsc_status"
            echo "lint_status=$lint_status"
            echo "diff_check_status=$diff_check_status"
            echo "worktree_before_commit:"
            git status --short
            for log in \
              /tmp/generator-repair.log /tmp/generator-compile.log \
              /tmp/materialize.log /tmp/post-materialize-repair.log \
              /tmp/changed-python-compile.log /tmp/install-dev.log /tmp/npm-ci.log \
              /tmp/focused-pytest.log /tmp/lib-pytest.log /tmp/browser-tests.log \
              /tmp/tsc.log /tmp/lint.log /tmp/diff-check.log; do
              echo "===== $log (tail) ====="
              tail -n 120 "$log" 2>/dev/null || true
            done
          } > "$report"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$result" = success ]; then
            cp "$report" .brand-lock-verification.txt
            git add -u
            git add lib/persian_brand.py tests/lib/test_persian_brand.py \
              .brand-lock-verification.txt
            {
              echo "changed_files:"
              git diff --cached --name-only
            } >> .brand-lock-verification.txt
            git add .brand-lock-verification.txt
            git commit -m "fix: lock Persian brand and exact display text"
          else
            git reset --hard HEAD
            rm -f lib/persian_brand.py tests/lib/test_persian_brand.py
            cp "$report" .brand-lock-diagnostics.txt
            git add .brand-lock-diagnostics.txt
            git commit -m "chore: record Persian brand materialization failure"
          fi

          git push origin HEAD:fix/lock-persian-brand-exact-text
