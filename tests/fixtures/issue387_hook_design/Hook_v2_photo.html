<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Instagram Reel Hook - Image Version</title>

<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root{
    --yellow:#FFCF33;
    --yellow-2:#FFB800;
    --white:#F8F8F8;
    --panel:rgba(20,18,17,.52);
    --panel-border:rgba(255,255,255,.18);
    --shadow:rgba(0,0,0,.72);
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  html,body{
    width:100%;
    min-height:100%;
    background:#090909;
  }

  body{
    display:grid;
    place-items:center;
    font-family:'Vazirmatn',sans-serif;
  }

  /* خروجی استاندارد Reels */
  .stage{
    position:relative;
    width:1080px;
    height:1920px;
    overflow:hidden;
    background:#111;
  }

  /* ویدیوی اصلی */
  .stage > video,
  .stage > img.bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  /* اگر بک‌گراند روشن یا شلوغ باشد */
  .video-treatment{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
      linear-gradient(
        to bottom,
        rgba(0,0,0,.05) 0%,
        rgba(0,0,0,.10) 24%,
        rgba(0,0,0,.24) 44%,
        rgba(0,0,0,.32) 62%,
        rgba(0,0,0,.22) 78%,
        rgba(0,0,0,.08) 100%
      );
  }

  /* Safe Zone تقریبی ریلز
     چپ/راست: 110px
     بالا: 260px
     پایین: 440px
  */
  .safe-zone{
    position:absolute;
    left:110px;
    right:110px;
    top:260px;
    bottom:440px;
    pointer-events:none;
    display:none;
    border:2px dashed rgba(255,255,255,.35);
    border-radius:28px;
  }

  /* برای تست Safe Zone این خط را فعال کن */
  /* .safe-zone{display:block;} */

  .hook-wrap{
    position:absolute;
    left:110px;
    right:110px;
    top:455px;
    text-align:center;
    z-index:3;
    isolation:isolate;
  }

  /* سایه/مات نرم پشت کل متن */
  .hook-wrap::before{
    content:"";
    position:absolute;
    z-index:-2;
    left:-55px;
    right:-55px;
    top:-105px;
    bottom:-135px;
    background:
      radial-gradient(
        ellipse at 50% 46%,
        rgba(0,0,0,.60) 0%,
        rgba(0,0,0,.48) 34%,
        rgba(0,0,0,.22) 66%,
        rgba(0,0,0,0) 88%
      );
    filter:blur(2px);
  }

  /* خط کوچک بالای هوک */
  .accent-line{
    width:100px;
    height:5px;
    margin:0 auto 38px;
    border-radius:999px;
    background:linear-gradient(90deg,var(--yellow-2),#FFE176);
    box-shadow:0 0 18px rgba(255,184,0,.20);
  }

  .question{
    max-width:860px;
    margin:0 auto;
    color:var(--white);
    font-size:68px;
    line-height:1.52;
    font-weight:800;
    letter-spacing:-1.4px;
    text-shadow:
      0 4px 18px rgba(0,0,0,.82),
      0 1px 2px rgba(0,0,0,.95);
    text-wrap:balance;
  }

  .question .highlight{
    color:var(--yellow);
    font-weight:900;
    text-shadow:
      0 4px 18px rgba(0,0,0,.76),
      0 0 20px rgba(255,195,48,.08);
  }

  /* پل میانی */
  .bridge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-top:44px;
    padding:18px 48px 20px;
    min-height:78px;
    border-radius:999px;
    color:#F4F4F4;
    font-size:37px;
    line-height:1.2;
    font-weight:600;
    background:
      linear-gradient(
        180deg,
        rgba(42,39,37,.64),
        rgba(26,24,23,.50)
      );
    border:1.5px solid var(--panel-border);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.06),
      0 12px 38px rgba(0,0,0,.28);
    -webkit-backdrop-filter:blur(16px) saturate(110%);
    backdrop-filter:blur(16px) saturate(110%);
  }

  .hero-wrap{
    position:relative;
    display:inline-block;
    margin-top:35px;
    padding:0 18px 30px;
  }

  .hero{
    font-family:'Lalezar','Vazirmatn',sans-serif;
    color:var(--yellow);
    font-size:150px;
    line-height:1.03;
    font-weight:400;
    letter-spacing:-1px;
    text-shadow:
      0 6px 22px rgba(0,0,0,.72),
      0 14px 34px rgba(0,0,0,.42);
  }

  /* قلموی زیر عبارت نهایی */
  .brush{
    position:absolute;
    left:5%;
    right:5%;
    bottom:4px;
    height:28px;
    transform:rotate(-2.2deg);
    opacity:.98;
  }

  .brush::before,
  .brush::after{
    content:"";
    position:absolute;
    inset:0;
    background:var(--yellow);
    border-radius:80% 22% 72% 24% / 65% 42% 58% 34%;
  }

  .brush::before{
    clip-path:polygon(
      0 55%,
      7% 34%,
      18% 29%,
      31% 20%,
      48% 23%,
      64% 16%,
      82% 22%,
      100% 13%,
      97% 51%,
      82% 62%,
      66% 55%,
      48% 66%,
      28% 56%,
      12% 72%,
      0 70%
    );
  }

  .brush::after{
    opacity:.45;
    transform:translateY(6px) scaleX(.96);
    filter:blur(.7px);
  }

  /* هیچ انیمیشنی عمداً وجود ندارد:
     متن از فریم صفر کامل دیده می‌شود. */

  @media (max-width:1080px){
    .stage{
      width:100vw;
      height:177.777vw;
      max-height:100vh;
      max-width:56.25vh;
    }
  }
</style>
</head>

<body>
  <div class="stage">

    <!-- حالت عکس -->
    <img class="bg" src="photo.jpg" alt="">

    <div class="video-treatment"></div>
    <div class="safe-zone"></div>

    <section class="hook-wrap" aria-label="هوک ویدیو">
      <div class="accent-line"></div>

      <h2 class="question">
        فکر می‌کنی اگه دیر جواب بدی<br>
        بیشتر بهت <span class="highlight">علاقه‌مند</span> می‌شه؟
      </h2>

      <div class="bridge">
        دانشمندها یه چیز دیگه می‌گن
      </div>

      <div class="hero-wrap">
        <h1 class="hero">دقیقاً برعکسه</h1>
        <div class="brush" aria-hidden="true"></div>
      </div>
    </section>

  </div>
</body>
</html>
